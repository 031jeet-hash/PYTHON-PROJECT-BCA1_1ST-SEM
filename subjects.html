<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subjects | Zero to Hero</title>

<link rel="stylesheet" href="subjects.css">
</head>
<body>

<header class="navbar">
    <div class="logo">
        Zero<span>to</span>Hero.
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="#" class="active">Subjects</a>
    </nav>
</header>

<section class="hero">
    <h4>ACADEMIC SETUP</h4>
    <h1>Manage Your <span>Subjects</span></h1>
    <p>Select your course and semester to organise your learning.</p>
</section>

<div class="container">

    <div class="card">

        <h2>Course Details</h2>

        <label>Select Course</label>
        <select>
            <option>BCA</option>
            <option>B.Tech</option>
            <option>BBA</option>
            <option>B.Sc</option>
        </select>

        <label>Select Semester</label>
        <select>
            <option>Semester 1</option>
            <option>Semester 2</option>
            <option>Semester 3</option>
            <option>Semester 4</option>
            <option>Semester 5</option>
            <option>Semester 6</option>
        </select>

        <button>Save Details</button>

    </div>

    <div class="card">

        <h2>Add Subject</h2>

        <input type="text" placeholder="Enter Subject Name">

        <button class="orange">
            Add Subject
        </button>

    </div>

    <div class="card full-width">

        <h2>My Subjects</h2>

        <div class="subject-row">
            Programming in C
            <button class="remove">Remove</button>
        </div>

        <div class="subject-row">
            Python Programming
            <button class="remove">Remove</button>
        </div>

        <div class="subject-row">
            Data Structures
            <button class="remove">Remove</button>
        </div>

        <div class="subject-row">
            Database Management System
            <button class="remove">Remove</button>
        </div>

    </div>

</div>

<div class="back">
    <a href="index.html">← Back To Home</a>
</div>

</body>
</html>
