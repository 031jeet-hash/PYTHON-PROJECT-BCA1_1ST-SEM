<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Zero to Hero</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="auth-page">

    <div class="auth-container">

        <div class="auth-side">
            <a href="index.html" class="logo">
                Zero<span>to</span>Hero.
            </a>

            <div>
                <span class="eyebrow">WELCOME BACK</span>

                <h1>Every new day is another chance to improve.</h1>

                <p>
                    Pick up where you left off. Your progress is waiting.
                </p>
            </div>

            <p class="side-bottom">Make studying easy.</p>
        </div>

        <div class="auth-form-side">
            <div class="auth-box">

                <a href="index.html" class="back-link">
                    &larr; Back to Home
                </a>

                <h2>Welcome Back!</h2>

                <p class="muted">
                    Enter your details to access your account.
                </p>

                <form action="#" method="post">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="submit" class="btn auth-submit">
                        Login to Account &rarr;
                    </button>

                </form>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="register.html">Create One</a>
                </p>

            </div>
        </div>

    </div>

</body>
</html>
