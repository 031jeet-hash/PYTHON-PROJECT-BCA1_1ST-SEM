<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Zero to Hero</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>

<main class="auth-container">
    <section class="auth-card">

        <a href="index.html" class="app-logo">
            Zero <span>to Hero</span>
        </a>

        <div class="auth-heading">
            <span class="section-tag">JOIN OUR LEARNING COMMUNITY</span>
            <h1>Create Your Account</h1>
            <p>Start your academic journey with smarter learning.</p>
        </div>

        <form action="#" method="post" class="register-form">

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname"
                    placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                    placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="role">Account Type</label>
                <select id="role" name="role" required>
                    <option value="">Select your role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>

            <div class="form-group">
                <label for="institution">Institution Name</label>
                <input type="text" id="institution" name="institution"
                    placeholder="Enter your institution name" required>
            </div>

            <div class="form-group">
                <label for="course">Course / Department</label>
                <select id="course" name="course" required>
                    <option value="">Select course</option>
                    <option value="MCA">MCA</option>
                    <option value="MBA">MBA</option>
                    <option value="BBA">BBA</option>
                    <option value="BCA">BCA</option>
                    <option value="BSc CS">BSc Computer Science</option>
                    <option value="BSc DS">BSc Data Science</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="user-id">Institution ID / Invitation Code</label>
                <input type="text" id="user-id" name="user_id"
                    placeholder="Enter ID provided by institution">
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" name="password"
                    placeholder="Create a strong password" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password"
                    name="confirm_password"
                    placeholder="Re-enter your password" required>
            </div>

            <label class="terms-row">
                <input type="checkbox" name="terms" required>
                <span>I agree to the terms and privacy policy.</span>
            </label>

            <button type="submit" class="primary-btn auth-submit">
                Create Account →
            </button>

        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

        <p class="helper-text">
            Account registration and verification will be connected
            through the Python backend.
        </p>

    </section>
</main>

</body>
</html>
